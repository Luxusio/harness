  #
  # - element: "Date range picker"
  #   service: web-app
  #   page: /reports
  #   selector: ".date-range-picker input"
  #   strategy: "fill with '2026-01-01 ~ 2026-03-31' then press Tab"
  #   note: "Typing dates directly fails. Must use the exact format with ~ separator."
  #   discovered: 2026-04-15
  #
  # - element: "File upload dropzone"
  #   service: web-app
  #   page: /upload
  #   selector: "input[type='file']"
  #   strategy: "upload_file directly on hidden input"
  #   note: "Dropzone UI is a styled div. The actual input is hidden. Don't try to click the dropzone."
  #   discovered: 2026-04-15

# ── Test data ─────────────────────────────────────────────────────
# Maps test scenarios to the data needed. "When testing X, use data Y."

test_data: []
  # Example:
  # - scenario: "Active subscription checkout"
  #   service: web-app
  #   data:
  #     user: "premium_user@test.com"
  #     plan: "annual-premium"
  #     payment_method: "card-ending-4242"
  #   setup: "npm run db:seed -- --user premium_user"
  #   verify: "Dashboard shows 'Premium' badge"
  #
  # - scenario: "Expired subscription retry"
  #   service: web-app
  #   data:
  #     user: "expired_user@test.com"
  #     plan: "expired-basic"
  #   setup: "npm run db:seed -- --user expired_user"
  #   verify: "Shows upgrade prompt, not dashboard"
  #
  # - scenario: "Empty state - no items"
  #   service: web-app
  #   data:
  #     user: "new_user@test.com"
  #   setup: "Create fresh user, no data"
  #   verify: "Shows onboarding empty state"

# ── Known issues ──────────────────────────────────────────────────
# Flaky elements, race conditions, intermittent failures.
# QA agents check this before reporting failures.

known_issues: []
  # Example:
  # - element: "Modal close button"
  #   service: web-app
  #   symptom: "Sometimes takes 2 clicks to close"
  #   cause: "Race condition with CSS animation"
  #   workaround: "Wait 300ms after clicking close before next action"
  #   reliability: 80%  # how often the workaround works
  #   discovered: 2026-04-15
  #
  # - element: "Infinite scroll loader"
  #   service: web-app
  #   symptom: "Scroll triggers duplicate loads"
  #   cause: "IntersectionObserver fires twice on fast scroll"
  #   workaround: "Scroll incrementally by 500px using evaluate_script"
  #   reliability: 95%
  #   discovered: 2026-04-15

# ── QA patterns ───────────────────────────────────────────────────
# Cross-service testing patterns that QA agents should follow.

patterns:
  data_reset:
    command: null  # e.g., "npm run db:seed -- --env test"
    notes: "Command to reset test data to known state before QA session"

  auth_flow:
    steps: []
      # e.g., for form auth:
      # - "navigate to login_url"
      # - "fill email field"
      # - "fill password field"
      # - "click submit"
      # - "wait_for dashboard indicator element"
    notes: null

  screenshot_evidence:
    before_action: true
    after_action: true
    on_failure: true
    notes: "Take screenshots at these points for evidence"

# ── Discovered by QA runs ─────────────────────────────────────────
qa_notes:
  install_verified_session_hint:
    discovered: 2026-08-26
    notes: >
      The verified-install helper runs as a plain subprocess and resolves the
      session id from doc/harness/tasks/.active_sessions/.session-hint when
      current_session_id() returns "default". To exercise it against a temp
      fixture the task control file must contain exactly the four fields
      run_id, execution_mode, required_lenses, close_receipt_fingerprint, be
      mode 0600 with nlink 1, and run_id must be a valid uuid7; otherwise
      read_task_control() returns {} and validation reports the
      missing-or-invalid control error before any binding check runs.
    fixture_helper: tests/test_install_verified.py::_repo
  stale_hook_tree_detection:
    discovered: 2026-08-26
    notes: >
      hook_tree_health.receipt_capability_warning() reads BOTH the
      harness@harness installPath from
      <CLAUDE_CONFIG_DIR>/plugins/installed_plugins.json and the harness
      marketplace installLocation from known_marketplaces.json, and reports
      every registered tree that cannot record receipts. To exercise it, point
      CLAUDE_CONFIG_DIR at a fixture config; the helper accepts both the
      current nested layout (plugin/scripts, plugin/hooks) and the legacy
      layout (scripts, hooks at tree root), so a fixture in either shape with
      background_hook.py plus subagent_lifecycle.py and both SubagentStart and
      SubagentStop registered is the "healthy" control. An unparseable or
      absent hooks.json warns even when both modules are present; that is
      deliberate, not a fixture error.
    fixture_helper: tests/test_hook_tree_health.py::_tree
  attestation_pair_single_source:
    discovered: 2026-09-02
    notes: >
      The fixed missing-attestation blocked_reason/unblock_condition pair is
      owned solely by plugin/scripts/_lib.py
      (ATTESTATION_BLOCKED_REASON / ATTESTATION_UNBLOCK_CONDITION). To verify
      the runtime still delivers it to a caller, import with BOTH
      plugin/scripts and plugin/mcp on sys.path and use the canonical module
      names (`import harness_server`). Loading harness_server.py via
      importlib.spec_from_file_location raises
      PermissionError("task-control writer requires its canonical module
      import") from _lib.bind at import time. Delivery points:
      harness_server.RECEIPT_PENDING_VERIFY_NEXT_ACTION (returned by
      handle_task_verify only when runtime_verdict == PENDING AND
      watcher_status["receipts_recordable"] is not False) and
      stop_gate.attestation_block_instruction() (emitted unconditionally in
      the active-task block reason, so the pair reaches the caller even in the
      receipts_recordable=False branch).
    fixture_helper: tests/test_review_agent_contracts.py::test_missing_attestation_pair_has_exactly_one_authoritative_location
  contract_lint_weight_scope:
    discovered: 2026-09-02
    superseded: 2026-09-02
    notes: >
      SUPERSEDED — `contract_lint.py --check-weight` now scans BOTH
      <plugin-root>/skills/*/SKILL.md and <plugin-root>/internal-skills/*/SKILL.md,
      so a codex-tree SKILL.md over 500 lines is reported and
      "[SOFT] C-13 weight" against plugin-codex/internal-skills/develop/SKILL.md
      is expected output, not impossible output. Historical record: the scan
      previously covered only skills/, which left every codex twin unguarded —
      pushing plugin-codex/internal-skills/develop/SKILL.md to 502 lines emitted
      nothing and exited 0, while adding 37 lines to plugin/skills/develop/SKILL.md
      emitted the warning. Pinned by
      tests/test_skill_weight_contract.py::test_weight_lint_sees_the_codex_internal_skills_layout.
  pre_existing_test_failure:
    discovered: 2026-09-02
    superseded: 2026-09-02
    notes: >
      SUPERSEDED — do NOT deselect anything on the strength of this entry.
      tests/test_receipt_watcher_fail_closed.py::TestReadinessIsTriState::test_earlier_receipt_does_not_mask_live_worker_error
      now passes; commit 5a33299 implemented the identity precedence the test
      always required. The suite has no standing red, so a full run must be
      green with no deselects. Historical record: the test shipped red in
      a095c76 (the commit that introduced it) and stayed red through 3e4585b,
      where the baseline was "1 failed, 984 passed".
  sandbox_suite_pollution:
    discovered: 2026-09-02
    notes: >
      Running pytest against a tar-copied working tree in scratchpad leaves
      task-dir/receipt state behind, so a second run in the same copy shows
      spurious tests/test_harness_mcp_server.py failures. Re-copy the tree for
      each mutation-testing baseline instead of reusing one sandbox.
  mcp_bash_guard_false_positive:
    discovered: 2026-09-02
    notes: >
      The mcp_bash_guard blocks a Bash command whose text contains
      `cp ... plugin/scripts/_lib.py` even when both operands are inside a
      scratchpad sandbox outside the repo. The guard matches the command
      string, not the resolved target path. Workaround for sandboxed
      mutation testing: perform file restores in Python
      (pathlib.write_text) rather than shell cp/mv.
  verdict_parser_probe_harness:
    discovered: 2026-09-02
    notes: >
      To exercise the receipt verdict parser directly without spawning a lens:
      sys.path.insert(0, "plugin/scripts") then call
      _lib.normalize_receipt_completion(lens, body) and _lib.extract_qa_verdict(text).
      For an end-to-end task_verify/task_context probe, import
      tests/test_receipt_watcher_fail_closed.py and reuse its module-level
      _server() and _task_with_receipt() context manager; write a PLAN.md into
      the temp task dir or emit_compact_context short-circuits on the
      "Create PLAN.md" branch before reaching the review/QA next_action text.
  counts_line_is_not_stripped:
    discovered: 2026-09-02
    superseded: 2026-09-02
    notes: >
      SUPERSEDED — _lib.normalize_receipt_completion now strips summary_lines[1]
      before matching, like line 0 and later lines. A trailing space, a leading
      indent, or a tab on an otherwise valid counts line binds normally, and the
      stored compact records the normalized text. Historical record: it was the
      one whitespace-strict line in the parser, so such a final bound
      PENDING / FINDING_COUNTS: INVALID. Surrounding whitespace is no longer a
      reason a well-looking review final binds PENDING; look for a differing
      bare verdict/counts line, a line-1 shape defect, or interior whitespace
      instead. Pinned by
      tests/test_receipt_watcher_fail_closed.py::TestVerdictAuthorityIsPositional::test_counts_line_whitespace_does_not_discard_the_review.
  qa_venv_has_no_pip_or_pyyaml:
    discovered: 2026-09-02
    notes: >
      .venv/bin/python has no pip module and no PyYAML; system python3 has no
      PyYAML either. To parse doc/harness/qa/QA_KNOWLEDGE.yaml in a QA run use
      `uv pip install pyyaml` (uv is on PATH and targets .venv), not
      `.venv/bin/python -m pip`.
  suite_is_green_and_xdist_stable:
    discovered: 2026-09-02
    notes: >
      At HEAD 5a33299 + the verdict-parser-residual-defects diff,
      `.venv/bin/python -m pytest tests/ -q` is 1001 passed / 228 subtests,
      0 deselected, 0 skipped, ~15s, xdist-3.8.0 with `-n auto --dist worksteal`
      from pyproject addopts. 16 consecutive full-suite runs were green;
      test_harness_mcp_server.py::HarnessMcpServerPR2CloseGate::
      test_legacy_conversation_file_has_no_close_authority did not fail in
      16/16 full-suite runs nor 12/12 isolated runs. Treat the earlier
      1-in-5 report as unreproduced on this host.
  contract_lint_weight_is_soft_and_quiet_hides_it:
    discovered: 2026-09-02
    notes: >
      `contract_lint.py --check-weight` reports C-13 overage as [SOFT] and still
      exits 0, and `--quiet` suppresses the warning entirely. A typo'd
      `--plugin-root` also exits 0 silently. Never treat exit 0 from
      --check-weight as proof the budget was scanned; assert on the
      "[SOFT] C-13 weight" string instead.
  hook_tree_health_candidate_roots:
    discovered: 2026-09-02
    notes:
      - "CLAUDE_CONFIG_DIR drives hook_tree_health.py's __main__ end-to-end; build a fixture config dir with plugins/known_marketplaces.json ({\"harness\": {\"installLocation\": \"...\"}}) and plugins/installed_plugins.json ({\"version\":2,\"plugins\":{\"harness@harness\":[{\"installPath\":\"...\"}]}}) to exercise every branch without touching ~/.claude."
      - "Also unset HARNESS_RUNTIME and CODEX_THREAD_ID; _runtime() infers codex from CODEX_THREAD_ID and short-circuits the Claude registration branch."
      - "This host is permanently in the split-tree state: installed_plugins.json -> ~/.claude/plugins/cache/harness/harness/2.3.0 (genuinely lacks background_hook.py/subagent_lifecycle.py) beside marketplace installLocation ~/.claude/harness-dev (capable). RECEIPT_HOOKS_UNAVAILABLE firing at task_start is EXPECTED and is not a defect; RECEIPTS.jsonl for the run is the settling evidence."
      - "contract_lint.py --check-weight takes --plugin-root; the roots worth checking on this host are ./plugin and /home/ccc/.claude/harness-dev/plugin."
      - "Exit codes are masked when piping to tail/grep; use `cmd >/dev/null 2>&1; echo $?` for real exit codes. contract_lint.py exits 2 on an unrecognized flag."
  next_action_mutation_sweep:
    discovered: 2026-09-02
    notes:
      - "To mutate RECEIPT_UNAVAILABLE_NEXT_ACTION / RECEIPT_PENDING_VERIFY_NEXT_ACTION, render the constant, split at 'blocked_reason=', rewrite the assignment as repr(mutated_prefix) followed by the two unchanged f-string ATTESTATION lines. Verified with an identical-restructure control: the full suite stays green, so every RED is a real deletion catch, not a restructure artifact."
      - "Clause-level sweep (split on comma/semicolon/period/em-dash) against the full suite: 29 clauses, exactly 1 survivor - the opening 'Task verification is still pending.' This reproduces the claim in test_every_normative_clause_in_both_next_actions_is_pinned's docstring."
      - "Word-level sweep is weaker than clause-level because the pins are assertIn substrings: 47 of 173 single-word deletions keep the pinning-test subset green (e.g. deleting 'If', 'Run', or a bare 'call'). None inverts meaning; 'not' in 'repository text do not' is RED, so the trust-boundary token is genuinely pinned."
      - "Full suite takes ~15s (1013 tests, 228 subtests, xdist); a 29-case clause sweep against it is ~8 min, a 173-case word sweep against the 6 pinning files (~2s each) is ~6 min."
