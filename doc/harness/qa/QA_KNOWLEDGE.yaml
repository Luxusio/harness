# QA Knowledge Base
# Accumulated testing knowledge for this project.
# QA agents read this before testing. Agents also WRITE discoveries back here.
# Updated: 2026-04-15

# ── Service registry ──────────────────────────────────────────────
# Each service the QA agents interact with. Auth, dev server, base URL.

services: {}
  # Example:
  # web-app:
  #   base_url: http://localhost:3000
  #   auth:
  #     required: true
  #     method: form              # form | api-key | oauth | basic | none
  #     login_url: /login
  #     credentials:
  #       email: test@example.com
  #       password: testpass123
  #     notes: Session cookie valid 30min. Re-login if 401.
  #   dev_server:
  #     command: npm run dev
  #     port: 3000
  #     startup_wait: 5
  #     health_check: "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000"
  #
  # api-server:
  #   base_url: http://localhost:8080/api
  #   auth:
  #     required: true
  #     method: api-key
  #     header: X-API-Key
  #     credentials:
  #       key: test-api-key-12345
  #     notes: Key has full access. Rotate in CI via API_KEY env var.

# ── Selector hints ────────────────────────────────────────────────
# UI elements that need special handling. Standard elements don't go here.
# Only elements where naive interaction (click, fill) fails.

selectors: []
  # Example:
  # - element: "Mobile hamburger menu"
  #   service: web-app
  #   page: /dashboard
  #   selector: "button[aria-label='Toggle navigation']"
  #   strategy: "click + wait_for text 'Menu'"
  #   note: "Standard click works but menu animates in. Wait needed before interacting with menu items."
  #   discovered: 2026-04-15
  #
  # - element: "Date range picker"
  #   service: web-app
  #   page: /reports
  #   selector: ".date-range-picker input"
  #   strategy: "fill with '2026-01-01 ~ 2026-03-31' then press Tab"
  #   note: "Typing dates directly fails. Must use the exact format with ~ separator."
  #   discovered: 2026-04-15
  #
  # - element: "File upload dropzone"
  #   service: web-app
  #   page: /upload
  #   selector: "input[type='file']"
  #   strategy: "upload_file directly on hidden input"
  #   note: "Dropzone UI is a styled div. The actual input is hidden. Don't try to click the dropzone."
  #   discovered: 2026-04-15

# ── Test data ─────────────────────────────────────────────────────
# Maps test scenarios to the data needed. "When testing X, use data Y."

test_data: []
  # Example:
  # - scenario: "Active subscription checkout"
  #   service: web-app
  #   data:
  #     user: "premium_user@test.com"
  #     plan: "annual-premium"
  #     payment_method: "card-ending-4242"
  #   setup: "npm run db:seed -- --user premium_user"
  #   verify: "Dashboard shows 'Premium' badge"
  #
  # - scenario: "Expired subscription retry"
  #   service: web-app
  #   data:
  #     user: "expired_user@test.com"
  #     plan: "expired-basic"
  #   setup: "npm run db:seed -- --user expired_user"
  #   verify: "Shows upgrade prompt, not dashboard"
  #
  # - scenario: "Empty state - no items"
  #   service: web-app
  #   data:
  #     user: "new_user@test.com"
  #   setup: "Create fresh user, no data"
  #   verify: "Shows onboarding empty state"

# ── Known issues ──────────────────────────────────────────────────
# Flaky elements, race conditions, intermittent failures.
# QA agents check this before reporting failures.

known_issues: []
  # Example:
  # - element: "Modal close button"
  #   service: web-app
  #   symptom: "Sometimes takes 2 clicks to close"
  #   cause: "Race condition with CSS animation"
  #   workaround: "Wait 300ms after clicking close before next action"
  #   reliability: 80%  # how often the workaround works
  #   discovered: 2026-04-15
  #
  # - element: "Infinite scroll loader"
  #   service: web-app
  #   symptom: "Scroll triggers duplicate loads"
  #   cause: "IntersectionObserver fires twice on fast scroll"
  #   workaround: "Scroll incrementally by 500px using evaluate_script"
  #   reliability: 95%
  #   discovered: 2026-04-15

# ── QA patterns ───────────────────────────────────────────────────
# Cross-service testing patterns that QA agents should follow.

patterns:
  data_reset:
    command: null  # e.g., "npm run db:seed -- --env test"
    notes: "Command to reset test data to known state before QA session"

  auth_flow:
    steps: []
      # e.g., for form auth:
      # - "navigate to login_url"
      # - "fill email field"
      # - "fill password field"
      # - "click submit"
      # - "wait_for dashboard indicator element"
    notes: null

  screenshot_evidence:
    before_action: true
    after_action: true
    on_failure: true
    notes: "Take screenshots at these points for evidence"

# ── Discovered by QA runs ─────────────────────────────────────────
qa_notes:
  install_verified_session_hint:
    discovered: 2026-08-26
    notes: >
      The verified-install helper runs as a plain subprocess and resolves the
      session id from doc/harness/tasks/.active_sessions/.session-hint when
      current_session_id() returns "default". To exercise it against a temp
      fixture the task control file must contain exactly the four fields
      run_id, execution_mode, required_lenses, close_receipt_fingerprint, be
      mode 0600 with nlink 1, and run_id must be a valid uuid7; otherwise
      read_task_control() returns {} and validation reports the
      missing-or-invalid control error before any binding check runs.
    fixture_helper: tests/test_install_verified.py::_repo
  stale_hook_tree_detection:
    discovered: 2026-08-26
    notes: >
      hook_tree_health.receipt_capability_warning() reads BOTH the
      harness@harness installPath from
      <CLAUDE_CONFIG_DIR>/plugins/installed_plugins.json and the harness
      marketplace installLocation from known_marketplaces.json, and reports
      every registered tree that cannot record receipts. To exercise it, point
      CLAUDE_CONFIG_DIR at a fixture config; the helper accepts both the
      current nested layout (plugin/scripts, plugin/hooks) and the legacy
      layout (scripts, hooks at tree root), so a fixture in either shape with
      background_hook.py plus subagent_lifecycle.py and both SubagentStart and
      SubagentStop registered is the "healthy" control. An unparseable or
      absent hooks.json warns even when both modules are present; that is
      deliberate, not a fixture error.
    fixture_helper: tests/test_hook_tree_health.py::_tree
  attestation_pair_single_source:
    discovered: 2026-09-02
    notes: >
      The fixed missing-attestation blocked_reason/unblock_condition pair is
      owned solely by plugin/scripts/_lib.py
      (ATTESTATION_BLOCKED_REASON / ATTESTATION_UNBLOCK_CONDITION). To verify
      the runtime still delivers it to a caller, import with BOTH
      plugin/scripts and plugin/mcp on sys.path and use the canonical module
      names (`import harness_server`). Loading harness_server.py via
      importlib.spec_from_file_location raises
      PermissionError("task-control writer requires its canonical module
      import") from _lib.bind at import time. Delivery points:
      harness_server.RECEIPT_PENDING_VERIFY_NEXT_ACTION (returned by
      handle_task_verify only when runtime_verdict == PENDING AND
      watcher_status["receipts_recordable"] is not False) and
      stop_gate.attestation_block_instruction() (emitted unconditionally in
      the active-task block reason, so the pair reaches the caller even in the
      receipts_recordable=False branch).
    fixture_helper: tests/test_review_agent_contracts.py::test_missing_attestation_pair_has_exactly_one_authoritative_location
  contract_lint_weight_scope:
    discovered: 2026-09-02
    superseded: 2026-09-02
    notes: >
      SUPERSEDED — `contract_lint.py --check-weight` now scans BOTH
      <plugin-root>/skills/*/SKILL.md and <plugin-root>/internal-skills/*/SKILL.md,
      so a codex-tree SKILL.md over 500 lines is reported and
      "[SOFT] C-13 weight" against plugin-codex/internal-skills/develop/SKILL.md
      is expected output, not impossible output. Historical record: the scan
      previously covered only skills/, which left every codex twin unguarded —
      pushing plugin-codex/internal-skills/develop/SKILL.md to 502 lines emitted
      nothing and exited 0, while adding 37 lines to plugin/skills/develop/SKILL.md
      emitted the warning. Pinned by
      tests/test_skill_weight_contract.py::test_weight_lint_sees_the_codex_internal_skills_layout.
  pre_existing_test_failure:
    discovered: 2026-09-02
    superseded: 2026-09-02
    notes: >
      SUPERSEDED — do NOT deselect anything on the strength of this entry.
      tests/test_receipt_watcher_fail_closed.py::TestReadinessIsTriState::test_earlier_receipt_does_not_mask_live_worker_error
      now passes; commit 5a33299 implemented the identity precedence the test
      always required. The suite has no standing red, so a full run must be
      green with no deselects. Historical record: the test shipped red in
      a095c76 (the commit that introduced it) and stayed red through 3e4585b,
      where the baseline was "1 failed, 984 passed".
  sandbox_suite_pollution:
    discovered: 2026-09-02
    notes: >
      Running pytest against a tar-copied working tree in scratchpad leaves
      task-dir/receipt state behind, so a second run in the same copy shows
      spurious tests/test_harness_mcp_server.py failures. Re-copy the tree for
      each mutation-testing baseline instead of reusing one sandbox.
  mcp_bash_guard_false_positive:
    discovered: 2026-09-02
    notes: >
      The mcp_bash_guard blocks a Bash command whose text contains
      `cp ... plugin/scripts/_lib.py` even when both operands are inside a
      scratchpad sandbox outside the repo. The guard matches the command
      string, not the resolved target path. Workaround for sandboxed
      mutation testing: perform file restores in Python
      (pathlib.write_text) rather than shell cp/mv.
  verdict_parser_probe_harness:
    discovered: 2026-09-02
    notes: >
      To exercise the receipt verdict parser directly without spawning a lens:
      sys.path.insert(0, "plugin/scripts") then call
      _lib.normalize_receipt_completion(lens, body) and _lib.extract_qa_verdict(text).
      For an end-to-end task_verify/task_context probe, import
      tests/test_receipt_watcher_fail_closed.py and reuse its module-level
      _server() and _task_with_receipt() context manager; write a PLAN.md into
      the temp task dir or emit_compact_context short-circuits on the
      "Create PLAN.md" branch before reaching the review/QA next_action text.
  counts_line_is_not_stripped:
    discovered: 2026-09-02
    superseded: 2026-09-02
    notes: >
      SUPERSEDED — _lib.normalize_receipt_completion now strips summary_lines[1]
      before matching, like line 0 and later lines. A trailing space, a leading
      indent, or a tab on an otherwise valid counts line binds normally, and the
      stored compact records the normalized text. Historical record: it was the
      one whitespace-strict line in the parser, so such a final bound
      PENDING / FINDING_COUNTS: INVALID. Surrounding whitespace is no longer a
      reason a well-looking review final binds PENDING; look for a differing
      bare verdict/counts line, a line-1 shape defect, or interior whitespace
      instead. Pinned by
      tests/test_receipt_watcher_fail_closed.py::TestVerdictAuthorityIsPositional::test_counts_line_whitespace_does_not_discard_the_review.
  qa_venv_has_no_pip_or_pyyaml:
    discovered: 2026-09-02
    notes: >
      .venv/bin/python has no pip module and no PyYAML; system python3 has no
      PyYAML either. To parse doc/harness/qa/QA_KNOWLEDGE.yaml in a QA run use
      `uv pip install pyyaml` (uv is on PATH and targets .venv), not
      `.venv/bin/python -m pip`.
  suite_is_green_and_xdist_stable:
    discovered: 2026-09-02
    notes: >
      At HEAD 5a33299 + the verdict-parser-residual-defects diff,
      `.venv/bin/python -m pytest tests/ -q` is 1001 passed / 228 subtests,
      0 deselected, 0 skipped, ~15s, xdist-3.8.0 with `-n auto --dist worksteal`
      from pyproject addopts. 16 consecutive full-suite runs were green;
      test_harness_mcp_server.py::HarnessMcpServerPR2CloseGate::
      test_legacy_conversation_file_has_no_close_authority did not fail in
      16/16 full-suite runs nor 12/12 isolated runs. Treat the earlier
      1-in-5 report as unreproduced on this host.
  contract_lint_weight_is_soft_and_quiet_hides_it:
    discovered: 2026-09-02
    notes: >
      `contract_lint.py --check-weight` reports C-13 overage as [SOFT] and still
      exits 0, and `--quiet` suppresses the warning entirely. A typo'd
      `--plugin-root` also exits 0 silently. Never treat exit 0 from
      --check-weight as proof the budget was scanned; assert on the
      "[SOFT] C-13 weight" string instead.
  hook_tree_health_candidate_roots:
    discovered: 2026-09-02
    notes:
      - "CLAUDE_CONFIG_DIR drives hook_tree_health.py's __main__ end-to-end; build a fixture config dir with plugins/known_marketplaces.json ({\"harness\": {\"installLocation\": \"...\"}}) and plugins/installed_plugins.json ({\"version\":2,\"plugins\":{\"harness@harness\":[{\"installPath\":\"...\"}]}}) to exercise every branch without touching ~/.claude."
      - "Also unset HARNESS_RUNTIME and CODEX_THREAD_ID; _runtime() infers codex from CODEX_THREAD_ID and short-circuits the Claude registration branch."
      - "This host is permanently in the split-tree state: installed_plugins.json -> ~/.claude/plugins/cache/harness/harness/2.3.0 (genuinely lacks background_hook.py/subagent_lifecycle.py) beside marketplace installLocation ~/.claude/harness-dev (capable). RECEIPT_HOOKS_UNAVAILABLE firing at task_start is EXPECTED and is not a defect; RECEIPTS.jsonl for the run is the settling evidence."
      - "contract_lint.py --check-weight takes --plugin-root; the roots worth checking on this host are ./plugin and /home/ccc/.claude/harness-dev/plugin."
      - "Exit codes are masked when piping to tail/grep; use `cmd >/dev/null 2>&1; echo $?` for real exit codes. contract_lint.py exits 2 on an unrecognized flag."
  next_action_mutation_sweep:
    discovered: 2026-09-02
    notes:
      - "To mutate RECEIPT_UNAVAILABLE_NEXT_ACTION / RECEIPT_PENDING_VERIFY_NEXT_ACTION, render the constant, split at 'blocked_reason=', rewrite the assignment as repr(mutated_prefix) followed by the two unchanged f-string ATTESTATION lines. Verified with an identical-restructure control: the full suite stays green, so every RED is a real deletion catch, not a restructure artifact."
      - "Clause-level sweep (split on comma/semicolon/period/em-dash) against the full suite: 29 clauses, exactly 1 survivor - the opening 'Task verification is still pending.' This reproduces the claim in test_every_normative_clause_in_both_next_actions_is_pinned's docstring."
      - "Word-level sweep is weaker than clause-level because the pins are assertIn substrings: 47 of 173 single-word deletions keep the pinning-test subset green (e.g. deleting 'If', 'Run', or a bare 'call'). None inverts meaning; 'not' in 'repository text do not' is RED, so the trust-boundary token is genuinely pinned."
      - "Full suite takes ~15s (1013 tests, 228 subtests, xdist); a 29-case clause sweep against it is ~8 min, a 173-case word sweep against the 6 pinning files (~2s each) is ~6 min."
  pytest_suite_stability_under_xdist:
    discovered: 2026-09-03
    notes:
      - "The suite runs under pytest-xdist (addopts -n auto --dist worksteal in pyproject.toml), so worker partitioning changes between runs and a single green run does not establish stability. Run the full suite >=10 times before accepting 'green'."
      - "Observed intermittent signature: PermissionError 'TASK.json mutation requires the task-control MCP' raised from _trusted_control_writer() in plugin/scripts/_lib.py, failing tests in tests/test_harness_mcp_server.py::HarnessMcpServerPR2CloseGate and tests/test_receipt_watcher_fail_closed.py::TestReadinessIsTriState."
      - "_make_control_writer_authority binds harness_server code objects and walks the caller stack; a test that loads its own copy of that module can leave the binding unable to recognise a legitimate caller sharing the same worker."
      - "Interpreter is .venv/bin/python; system python3 has no pytest. Use -n0 to disable xdist -- '-p no:xdist' conflicts with the injected addopts and errors out."
      - "RESOLVED 2026-09-03: the dominant cause was importlib.reload(_lib) in tests/test_promote_learnings_current_run.py, which emptied the control-writer bindings closure. Full analysis in doc/harness/REQ__test-suite-determinism-under-xdist.md. Do not re-open a HarnessMcpServerPR2CloseGate PermissionError from this note; the >=10-run guidance above remains durable."
  preexisting_single_worker_order_dependency:
    discovered: 2026-09-03
    notes:
      - "RESOLVED 2026-09-03. Was: pytest -n0 tests/test_harness_mcp_server.py tests/test_receipt_watcher_fail_closed.py failing on TestNonParsingCompletionIsNamed::test_trailing_verdict_completion_is_reported_as_a_format_failure. Cause was the unguarded harness_server re-exec in test_harness_mcp_server.py; the reuse guard fixed it. Do not re-open from this note."
  appending_to_this_file:
    discovered: 2026-09-03
    notes:
      - "This document is a mapping. Append under an existing top-level key as '<slug>: {discovered, notes}' -- never as a top-level '- topic:' sequence item. Doing so makes the whole file unparseable and destroys every accumulated section at once. This has now happened twice (2026-09-02, 2026-09-03); tests/test_qa_knowledge_shape.py catches it."
  contract_lint_mutation_probes:
    discovered: 2026-09-03
    notes:
      - "contract_lint guards are mutation-verifiable in seconds. Duplicate id: insert a second '### C-01' block -> [HARD] duplicate contract id, CLI exit 1. Marker tamper: sed harness:managed-begin -> [HARD] markers missing/duplicated/inverted, exit 1. Broken Enforced-by path: rewrite a backticked path to a nonexistent file -> [SOFT], CLI exit stays 0 (soft is advisory) but tests/test_contract_lint_real_tree.py asserts report.soft == [] so the suite still reddens. Weight: append 2 lines to plugin-codex/internal-skills/develop/SKILL.md (exactly 500) -> [SOFT] C-13 weight, but only with --plugin-root plugin-codex; the CLI default ./plugin never reaches the codex twin."
      - "Trimming plugin-codex/internal-skills/develop/SKILL.md to 450 lines keeps test_contract_lint_real_tree.py fully green (5 passed) -- the cap-boundary test derives its threshold from the file length, not from SKILL_WEIGHT_LIMIT."
  suite_isolation_ab_recipes:
    discovered: 2026-09-03
    notes:
      - "Deterministic, no xdist: '.venv/bin/python -m pytest -q -n0 tests/test_promote_learnings_current_run.py tests/test_harness_mcp_server.py'. With importlib.reload(_lib) present in setUp -> 53 failed, 57 passed; without -> 104 passed."
      - "The harness_server reuse guard in tests/test_harness_mcp_server.py is only load-bearing when another file imports harness_server FIRST. Repro: '-n0 tests/test_session_hint_marker_binding.py tests/test_harness_mcp_server.py' -> collection error when the guard is reverted, 101 passed with it. The pair ordering recorded elsewhere (test_harness_mcp_server + test_receipt_watcher_fail_closed) does NOT reproduce it in either direction."
      - "The tests/conftest.py autouse _SERVER restore fixture measured 3/10 red on tests/test_harness_mcp_server.py when reverted and 0/10 with it, on a 24-core aarch64 Linux 6.12.69-linuxkit host."
      - "pyproject addopts inject '-n auto --dist worksteal'; '-p no:xdist' errors. Use '-n0' for serial. Full suite: ~15s parallel, ~60-200s serial."
  stop_gate_state_matrix_probe:
    discovered: 2026-09-03
    notes:
      - "stop_gate.py reason text is state-dependent. Reproduce every branch by building fake repos with tests/test_stop_gate.py helpers (_fake_repo, _write_completed_lenses) and running the script as a subprocess with HARNESS_BACKGROUND_WAIT_SECS=0. Branches: no-task-dir, plan-missing, review-pending, qa-pending, review-fail, review-blocked-env, qa-fail, close-ready, task-blocked (silent), no-active (silent), non-harness-repo (silent), corrupt TASK.json, corrupt RECEIPTS.jsonl."
      - "Measured reason sizes on 24-core aarch64 Linux 6.12.69-linuxkit: HEAD 3e4585b was 192 words / 1411 chars in EVERY blocking state (not ~250). After TASK__state-aware-stop-gate-message: no-task-dir 92/624, plan-missing 112/768, review-pending 202/1401, qa-pending 195/1355, close-ready 100/676. The qa-pending figure originally recorded here (157/1072) was a mid-task measurement taken while the dedup guard was keyed on the partial phrase 'structurally delivered'; that guard dropped two trust-boundary clauses and was fixed before the task closed. Measurement entries must name the tree state they were taken on."
      - "emit_compact_context missing_for_close can contain at most three items (PLAN.md, review verdict, QA verdict), so any '+N more' truncation branch keyed on len(missing) > 3 is unreachable in production."
      - "The qa-pending next_action from emit_compact_context contains the substring 'structurally delivered' but NOT 'actual FAIL or BLOCKED_ENV takes precedence' nor the coordinator-paraphrase exclusion list. Any dedup guard keyed on the short substring silently drops those clauses in that branch."
      - "A/B a gate change against HEAD by copying plugin/scripts to a scratch dir and overwriting only stop_gate.py from 'git show HEAD:...' - the script does sys.path.insert(dirname(__file__)) so it must sit beside _lib.py."
  stop_gate_trust_boundary_guard:
    discovered: 2026-09-03
    notes:
      - "Resolution of the dedup hazard recorded in stop_gate_state_matrix_probe: the guard now keys on 'BLOCKED_ENV takes precedence', which is a reliable marker for a complete restatement. Verified exhaustive: that phrase occurs in exactly one next_action producer, plugin/scripts/_lib.py:3375 (the review-pending branch). No string returned by stop_gate._next_action_for_missing contains it, so no other suppression path exists."
      - "Residual: the review-pending next_action restates 3 of the 4 boundary fragments; 'actual review PASS must precede actual QA PASS' is not restated verbatim, so that sentence is absent from the review-pending reason while present in every other blocking state. Ordering is still conveyed narratively by that branch."
      - "To assert the QA-pending branch is actually reached (not a fixture fall-through to the no-derived-state path), check emit_compact_context(td)['next_action'].startswith('Run and await the required QA subagent(s)') and missing_for_close == ['completed QA verdict: qa-cli']. _write_completed_lenses(repo, task_id, [('review-code','PASS')]) reaches it."
  stop_gate_reason_ab_and_mutation_method:
    discovered: 2026-09-03
    notes:
      - "A/B stop_gate gate logic against HEAD by comparing every payload key EXCEPT reason (decision, next_action_command, owner_skill, docs, exit code, stdout-empty) across fabricated states. 19 states checked on 2026-09-03 (incl. corrupt TASK.json, corrupt RECEIPTS.jsonl, empty/traversal/unicode .active, no manifest, non-repo, malformed/empty/null stdin): zero non-reason differences."
      - "task_blocked silent-allow is only reachable when BLOCKED.md passes _lib._blocked_artifact_valid: regular file, owned by uid, st_nlink==1, and no group/other write bit. Under a 002 umask a fabricated BLOCKED.md is 0664 -> status 'invalid' -> the gate still blocks. chmod 600 the fixture."
      - "Mutation-test stop_gate by backing the file up, writing the mutant in place, running '.venv/bin/python -m pytest tests/test_stop_gate.py -n0 -q', and restoring in a finally block. Verified 2026-09-03: guard reverted to the partial phrase -> test_trust_boundary_survives_the_qa_pending_branch red; trust-boundary block deleted -> 2 red; inlined 'Next:' deleted -> test_attestation_pair_is_absent_when_that_branch_does_not_apply red."
      - "CORRECTION to stop_gate_state_matrix_probe: its 'qa-pending 157/1072' is NOT the shipped size. 157w is what the pre-fix guard (keyed on 'structurally delivered') produced; the shipped tree measures 195w/1355c for qa-pending. review-pending 202w, plan-missing 112w, no-task-dir 92w are current. Char counts vary a few chars with task_id length."
  trust_boundary_canonical_constant:
    discovered: 2026-09-03
    notes:
      - "plugin/scripts/_lib.py now owns TRUST_BOUNDARY (the four-element C-14 sentence block). stop_gate.py keeps a spelled-out literal because tests/test_review_agent_contracts.py::test_direct_blocker_flow_preserves_structural_result_trust_boundary is a raw-source scan over 9 surfaces and cannot see a reference; tests/test_stop_gate.py::test_emitted_trust_boundary_equals_the_canonical_constant is the drift guard between them."
      - "Differential A/B recipe for emit_compact_context + stop_gate: 'git archive HEAD | tar x -C <scratch>/head', copy the worktree to <scratch>/wt, then drive both trees with one script that builds 9 states (no_plan, review_pending, review_fail, review_blocked, qa_pending, qa_fail, qa_blocked, both_pass, no_active) and diffs the full JSON. Measured on the TASK__trust-boundary-single-constant worktree (HEAD 3e4585b + staged diff), 24-core aarch64 Linux 6.12.69-linuxkit: only review_pending and qa_pending differ, and only in reason/next_action; decision, owner_skill, docs, next_action_command shape and exit codes are byte-identical."
      - "The MCP task_verify PENDING branch (plugin/mcp/harness_server.py handle_task_verify) OVERWRITES ctx['next_action'] with RECEIPT_PENDING_VERIFY_NEXT_ACTION, so _lib branch text does not reach task_verify while runtime_verdict is PENDING. Verify _lib next_action changes through handle_task_context / handle_task_start instead. Measured 2026-09-03 on the same worktree: task_context qa-pending carried 1 of 4 boundary elements at HEAD and 4 of 4 after the change; task_verify still carries 3 of 4 paraphrased (exclusion list absent) on both, which PLAN AC-2 leaves out of scope."
