  - topic: "Codex payload staleness in a scratch root; importing harness_server as a module"
    detail: >
      To probe install._codex_payload_state in scratch, set install.CODEX_INSTALL_ROOT=<tmp>/codexroot before
      calling it (it reads the module global, not an argument). Without the codex CLI the cache half always
      reports 'Codex current cache: target is missing' (install_codex populates it), so look for the
      'Codex mirror: installed payload differs' reason in STALE output. A planted mirror/scripts/stop_gate.py
      flips mirror to STALE; sync_codex_payload removes it. Separately: `import harness_server` of
      /project/.../plugin/mcp with mise python3 from a scratch cwd raises PermissionError('task-control writer
      requires its canonical module import') on this fakeowner bind mount, while .venv/bin/python, repo cwd, or
      a copied tree under /tmp import fine. Environmental; not a regression. The MCP server as a script
      (`python3 plugin/mcp/harness_server.py` with tools/list on stdin) works.
    discovered: 2026-09-23
