  - topic: "python3 resolution is cwd-dependent on this host (mise shim)"
    detail: >
      /home/ccc/.local/share/mise/shims/python3 resolves to mise CPython 3.12.13 (Clang) when cwd has a
      trusted mise config (this repo), and to /usr/bin/python3 3.12.3 (GCC) from other cwds such as /tmp
      sandboxes. Both share importlib magic b'\xcb\r\r\n' and cache tag cpython-312, so __pycache__ written
      by one is header-valid for the other while co_linetable bytes differ. That trips the receipt-adapter
      guard in plugin/scripts/_lib.py: subagent_lifecycle import raises StaleBytecodeCacheError (PermissionError
      at e291dae), stop_gate.py exits 1 with empty stdout, and hooks.json's `|| true` masks it.
