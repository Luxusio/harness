[project]
name = "harness"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "markdown-it-py>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--dist", "worksteal"]
