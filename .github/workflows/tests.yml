name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install repository toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install test dependencies
        run: |
          mise exec -- python -m pip install --upgrade pip
          mise exec -- python -m pip install --group dev

      - name: Run full test suite
        env:
          HARNESS_SKIP_STDIN: "1"
        run: python -m pytest tests/ -x --tb=short

      - name: Run packaged golden replay smoke
        env:
          HARNESS_SKIP_STDIN: "1"
          HARNESS_SKIP_PREREAD: "1"
        run: python plugin/scripts/golden_replay.py --json > /tmp/golden-replay.json
